# gappd configuration — local-first by default
# Copy to ~/.gappd/config.toml and edit values.

# Path to the SQLite database file
db_path = "~/.gappd/db.sqlite"

[ai]
# AI provider. Supported: "llamacpp"
provider = "llamacpp"
# llama.cpp OpenAI-compatible model alias
model = "LiquidAI/LFM2-2.6B-Transcript-GGUF"
# llama.cpp HTTP endpoint
endpoint = "http://127.0.0.1:11436"
temperature = 0.3
