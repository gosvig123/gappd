name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Download modules
        run: go mod download

      - name: Check generated protocol
        run: go run ./cmd/gen-protocol -check

      - name: Run tests
        run: go test ./...

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Audit desktop production dependencies
        run: npm audit --omit=dev
        working-directory: desktop

      - name: Test desktop
        run: npm test
        working-directory: desktop

      - name: Type-check desktop
        run: npm run typecheck
        working-directory: desktop

      - name: Build CLI
        run: |
          mkdir -p ./build
          go build -o ./build/gappd ./cmd/gappd

  cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-admin
          POSTGRES_DB: cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: cloud
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:synthetic-ci-admin@localhost:5432/cloud_test?sslmode=disable
      TEST_DATABASE_URL: postgres://gappd_reader:synthetic-test-password-only@localhost:5432/cloud_test?sslmode=disable
      TEST_CLEANUP_DATABASE_URL: postgres://gappd_demo_cleanup:synthetic-test-password-only@localhost:5432/cloud_test?sslmode=disable
      TEST_DEMO_DATABASE_URL: postgres://gappd_demo_writer:synthetic-test-password-only@localhost:5432/cloud_test?sslmode=disable
      TEST_MEETING_DATABASE_URL: postgres://gappd_meeting_writer:synthetic-test-password-only@localhost:5432/cloud_test?sslmode=disable
      TEST_MEETING_CLEANUP_DATABASE_URL: postgres://gappd_meeting_cleanup:synthetic-test-password-only@localhost:5432/cloud_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cloud/go.mod
          cache-dependency-path: cloud/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Build cloud container
        run: docker build -t gappd-cloud:test .
