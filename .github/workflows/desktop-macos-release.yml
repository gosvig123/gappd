name: Desktop macOS Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish as stable
        required: true
        type: string
  push:
    branches:
      - beta

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Expose Meeting sync controls; account connection and upload consent remain separate.
      GAPPD_MEETING_UPLOAD_ENABLED: 'true'
      GAPPD_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GAPPD_GOOGLE_OAUTH_CLIENT_ID }}
      # The cloud identity is baked in, because a packaged build cannot read a runtime
      # environment variable. Setting these two repository variables switches the beta build
      # from the shared development instance to production, with no code change.
      GAPPD_CLERK_ISSUER_URL: ${{ vars.GAPPD_CLERK_ISSUER_URL }}
      GAPPD_CLERK_CLIENT_ID: ${{ vars.GAPPD_CLERK_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Resolve release metadata
        run: .github/scripts/resolve-desktop-release-metadata.sh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate release configuration
        run: .github/scripts/validate-desktop-release-config.sh
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Download Go modules
        run: go mod download

      - name: Set desktop package version
        run: |
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const version = process.env.RELEASE_VERSION
          for (const path of ['package.json', 'package-lock.json']) {
            const json = JSON.parse(readFileSync(path, 'utf8'))
            json.version = version
            if (json.packages?.['']) json.packages[''].version = version
            writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`)
          }
          NODE
        working-directory: desktop

      - name: Install desktop dependencies
        run: |
          started="$(date +%s)"
          npm ci
          echo "GAPPD_RELEASE_DEPS_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"
        working-directory: desktop

      - name: Plan llama.cpp runtime cache
        id: llamacpp-cache
        env:
          GAPPD_MAC_BUILD: universal
        run: |
          echo "GAPPD_RELEASE_CACHE_START=$(date +%s)" >> "$GITHUB_ENV"
          node desktop/scripts/prepare-llamacpp-bundle.mjs --print-cache-plan >> "$GITHUB_OUTPUT"

      - name: Restore llama.cpp runtime cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.llamacpp-cache.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.llamacpp-cache.outputs.key }}

      - name: Plan diarizer build cache
        id: diarizer-cache
        env:
          GAPPD_DIARIZER_SOURCES_SHA: ${{ hashFiles('gappd-diarizer/Package.swift', 'gappd-diarizer/Sources/**') }}
        run: bash .github/scripts/prepare-diarizer-cache.sh

      - name: Restore diarizer build cache
        uses: actions/cache@v4
        with:
          # These are the scratch paths gappd-diarizer/build.sh uses for the universal profile.
          path: |
            gappd-diarizer/.build/arm64
            gappd-diarizer/.build/x86_64
          key: ${{ steps.diarizer-cache.outputs.cache-key }}
          restore-keys: ${{ steps.diarizer-cache.outputs.restore-key }}

      - name: Configure signing identity
        run: |
          echo "GAPPD_RELEASE_CACHE_SECONDS=$(( $(date +%s) - ${GAPPD_RELEASE_CACHE_START:-$(date +%s)} ))" >> "$GITHUB_ENV"
          .github/scripts/configure-desktop-signing.sh
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Build release artifacts
        run: |
          export GAPPD_ENABLE_NOTARIZATION="$GAPPD_SIGNED_RELEASE"
          export GAPPD_REQUIRE_GATEKEEPER="$GAPPD_SIGNED_RELEASE"
          started="$(date +%s)"
          npm run dist:mac:universal -- --publish=never
          echo "GAPPD_RELEASE_BUILD_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Write beta update metadata
        run: |
          source="desktop/release/latest-mac.yml"
          target="desktop/release/beta-mac.yml"
          [ -f "$source" ] || { echo "Write beta update metadata failed: $source is missing. Ensure electron-builder emitted macOS update metadata." >&2; exit 1; }
          cp "$source" "$target"

      - name: Verify macOS app bundle
        run: |
          export GAPPD_ENABLE_NOTARIZATION="$GAPPD_SIGNED_RELEASE"
          export GAPPD_REQUIRE_GATEKEEPER="$GAPPD_SIGNED_RELEASE"
          npm run verify:mac-release
        working-directory: desktop

      - name: Verify release artifacts exist
        run: |
          shopt -s nullglob
          app_paths=(desktop/release/mac*/Gappd.app)
          dmg_paths=(desktop/release/*.dmg)
          zip_paths=(desktop/release/*.zip)
          update_paths=(desktop/release/*-mac.yml)

          [ ${#app_paths[@]} -gt 0 ] || { echo "No packaged app found at desktop/release/mac*/Gappd.app" >&2; exit 1; }
          [ ${#dmg_paths[@]} -gt 0 ] || { echo "No DMG found at desktop/release/*.dmg" >&2; exit 1; }
          [ ${#zip_paths[@]} -gt 0 ] || { echo "No update ZIP found at desktop/release/*.zip" >&2; exit 1; }
          [ ${#update_paths[@]} -gt 0 ] || { echo "No update metadata found at desktop/release/*-mac.yml" >&2; exit 1; }

          printf 'Found app bundle: %s\n' "${app_paths[@]}"
          printf 'Found DMG: %s\n' "${dmg_paths[@]}"
          printf 'Found update ZIP: %s\n' "${zip_paths[@]}"
          printf 'Found update metadata: %s\n' "${update_paths[@]}"

      - name: Write release manifest
        run: node desktop/scripts/write-release-manifest.mjs

      - name: Report release phase timings and sizes
        run: bash .github/scripts/report-desktop-release.sh

      - name: Publish release
        run: .github/scripts/publish-desktop-release.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # Installers are published to the release; omit the unpacked app and duplicate downloads.
      # Keep only short-lived metadata and diagnostics in Actions.
      - name: Upload release metadata and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: gappd-desktop-macos-metadata
          retention-days: 7
          if-no-files-found: error
          path: |
            desktop/release/*.blockmap
            desktop/release/*-mac.yml
            desktop/release/latest.json
            desktop/release/builder-debug.yml
