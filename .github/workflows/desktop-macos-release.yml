name: Desktop macOS Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Validate release tag
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v, got: $RELEASE_TAG" >&2
              echo "Use a v* tag such as v0.1.0." >&2
              exit 1
              ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve signing mode
        run: |
          missing=0
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then missing=1; fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "GAPPD_SIGNED_RELEASE=1" >> "$GITHUB_ENV"
            echo "Signing mode: Apple signed and notarized"
          else
            echo "GAPPD_SIGNED_RELEASE=0" >> "$GITHUB_ENV"
            echo "Signing mode: unsigned development DMG because Apple release secrets are not configured"
          fi
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Download Go modules
        run: go mod download

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Write signing certificate
        if: env.GAPPD_SIGNED_RELEASE == '1'
        run: |
          CERT_PATH="$RUNNER_TEMP/gappd-macos-signing.p12"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          cert = os.environ['APPLE_CERTIFICATE_P12_BASE64']
          Path(os.environ['RUNNER_TEMP'], 'gappd-macos-signing.p12').write_bytes(base64.b64decode(cert))
          PY
          echo "CSC_LINK=$CERT_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}

      - name: Preflight signing identity
        if: env.GAPPD_SIGNED_RELEASE == '1'
        run: |
          CERT_PATH="$RUNNER_TEMP/gappd-macos-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/gappd-macos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY" >/dev/null; then
            echo "Expected signing identity not found in imported certificate: $APPLE_SIGNING_IDENTITY" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2 || true
            exit 1
          fi

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Build release artifacts
        run: |
          export GAPPD_ENABLE_NOTARIZATION="$GAPPD_SIGNED_RELEASE"
          export GAPPD_REQUIRE_GATEKEEPER="$GAPPD_SIGNED_RELEASE"
          npm run dist
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Verify macOS app bundle
        run: |
          export GAPPD_ENABLE_NOTARIZATION="$GAPPD_SIGNED_RELEASE"
          export GAPPD_REQUIRE_GATEKEEPER="$GAPPD_SIGNED_RELEASE"
          npm run verify:mac-release
        working-directory: desktop

      - name: Verify release artifacts exist
        run: |
          shopt -s nullglob
          app_paths=(desktop/release/mac*/Gappd.app)
          dmg_paths=(desktop/release/*.dmg)

          if [ ${#app_paths[@]} -eq 0 ]; then
            echo "No packaged app found at desktop/release/mac*/Gappd.app" >&2
            exit 1
          fi

          if [ ${#dmg_paths[@]} -eq 0 ]; then
            echo "No DMG found at desktop/release/*.dmg" >&2
            exit 1
          fi

          printf 'Found app bundle: %s\n' "${app_paths[@]}"
          printf 'Found DMG: %s\n' "${dmg_paths[@]}"

      - name: Write release manifest
        run: |
          shopt -s nullglob
          dmg_paths=(desktop/release/*.dmg)
          if [ ${#dmg_paths[@]} -ne 1 ]; then
            echo "Expected exactly one DMG for release, found ${#dmg_paths[@]}" >&2
            exit 1
          fi

          export DMG_NAME="$(basename "${dmg_paths[0]}")"
          export DMG_SHA256="$(shasum -a 256 "${dmg_paths[0]}" | awk '{print $1}')"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          version = tag.removeprefix('v')
          dmg_name = os.environ['DMG_NAME']
          release_url = f'https://github.com/{repo}/releases/tag/{tag}'
          download_url = f'https://github.com/{repo}/releases/download/{tag}/{quote(dmg_name)}'
          Path('desktop/release/latest.json').write_text(json.dumps({
            'version': version,
            'channel': 'stable',
            'minVersion': '0.1.0',
            'releaseUrl': release_url,
            'downloadUrl': download_url,
            'sha256': os.environ['DMG_SHA256'],
          }, indent=2) + '\n')
          PY
          cat desktop/release/latest.json

      - name: Publish release
        run: |
          set -euo pipefail
          if [ "$GAPPD_SIGNED_RELEASE" = "1" ]; then
            release_kind="signed and notarized"
          else
            release_kind="unsigned development"
          fi
          notes="Gappd macOS $release_kind build for $RELEASE_TAG."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Gappd $RELEASE_TAG" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Gappd $RELEASE_TAG" --notes "$notes" --verify-tag
          fi

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r asset; do
            case "$asset" in
              *.dmg|latest.json) gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" desktop/release/*.dmg desktop/release/latest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gappd-desktop-macos
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/latest.json
            desktop/release/mac*/**
