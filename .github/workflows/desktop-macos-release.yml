name: Desktop macOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  release:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CONTINUOUS_RELEASE_TAG: main-latest
      CONTINUOUS_RELEASE_NAME: Gappd main latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve signing mode
        run: |
          missing=0
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then missing=1; fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "GAPPD_SIGNED_RELEASE=1" >> "$GITHUB_ENV"
            echo "Signing mode: Apple signed and notarized"
          else
            echo "GAPPD_SIGNED_RELEASE=0" >> "$GITHUB_ENV"
            echo "Signing mode: unsigned development DMG because Apple release secrets are not configured"
          fi
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Download Go modules
        run: go mod download

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Write signing certificate
        if: env.GAPPD_SIGNED_RELEASE == '1'
        run: |
          CERT_PATH="$RUNNER_TEMP/gappd-macos-signing.p12"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          cert = os.environ['APPLE_CERTIFICATE_P12_BASE64']
          Path(os.environ['RUNNER_TEMP'], 'gappd-macos-signing.p12').write_bytes(base64.b64decode(cert))
          PY
          echo "CSC_LINK=$CERT_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}

      - name: Preflight signing identity
        if: env.GAPPD_SIGNED_RELEASE == '1'
        run: |
          CERT_PATH="$RUNNER_TEMP/gappd-macos-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/gappd-macos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY" >/dev/null; then
            echo "Expected signing identity not found in imported certificate: $APPLE_SIGNING_IDENTITY" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2 || true
            exit 1
          fi

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Set continuous release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="$(node - <<'NODE'
          const pkg = require('./package.json')
          const [major, minor] = pkg.version.split('.')
          console.log(`${Number(major)}.${Number(minor)}.${process.env.GITHUB_RUN_NUMBER}`)
          NODE
          )"
          npm version "$VERSION" --no-git-tag-version
          echo "GAPPD_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Continuous release version: $VERSION"
        working-directory: desktop

      - name: Build release artifacts
        run: |
          export GAPPD_ENABLE_NOTARIZATION="$GAPPD_SIGNED_RELEASE"
          export GAPPD_REQUIRE_GATEKEEPER="$GAPPD_SIGNED_RELEASE"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            npm run dist:mac:arm64
          else
            npm run dist
          fi
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Verify macOS app bundle
        run: |
          export GAPPD_ENABLE_NOTARIZATION="$GAPPD_SIGNED_RELEASE"
          export GAPPD_REQUIRE_GATEKEEPER="$GAPPD_SIGNED_RELEASE"
          npm run verify:mac-release
        working-directory: desktop

      - name: Verify release artifacts exist
        run: |
          shopt -s nullglob
          app_paths=(desktop/release/mac*/Gappd.app)
          dmg_paths=(desktop/release/*.dmg)

          if [ ${#app_paths[@]} -eq 0 ]; then
            echo "No packaged app found at desktop/release/mac*/Gappd.app" >&2
            exit 1
          fi

          if [ ${#dmg_paths[@]} -eq 0 ]; then
            echo "No DMG found at desktop/release/*.dmg" >&2
            exit 1
          fi

          printf 'Found app bundle: %s\n' "${app_paths[@]}"
          printf 'Found DMG: %s\n' "${dmg_paths[@]}"

      - name: Write continuous release manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          shopt -s nullglob
          dmg_paths=(desktop/release/*.dmg)
          if [ ${#dmg_paths[@]} -ne 1 ]; then
            echo "Expected exactly one DMG for continuous release, found ${#dmg_paths[@]}" >&2
            exit 1
          fi

          mkdir -p desktop/release/continuous
          cp "${dmg_paths[0]}" desktop/release/continuous/Gappd-main-latest-arm64.dmg
          export DMG_NAME="Gappd-main-latest-arm64.dmg"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          tag = os.environ['CONTINUOUS_RELEASE_TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          version = os.environ['GAPPD_RELEASE_VERSION']
          dmg_name = os.environ['DMG_NAME']
          release_url = f'https://github.com/{repo}/releases/tag/{tag}'
          download_url = f'https://github.com/{repo}/releases/download/{tag}/{quote(dmg_name)}'
          Path('desktop/release/continuous/latest.json').write_text(json.dumps({
            'version': version,
            'releaseUrl': release_url,
            'downloadUrl': download_url,
          }, indent=2) + '\n')
          PY
          cat desktop/release/continuous/latest.json

      - name: Publish continuous release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [ "$CONTINUOUS_RELEASE_TAG" != "main-latest" ]; then
            echo "Refusing to force-push unexpected release tag: $CONTINUOUS_RELEASE_TAG" >&2
            exit 1
          fi

          auth_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags "$auth_remote" main
          remote_main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$GITHUB_SHA" != "$remote_main_sha" ]; then
            echo "Skipping stale continuous release for $GITHUB_SHA; origin/main is $remote_main_sha."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # main-latest is intentionally moving metadata for in-app update checks.
          # Force is limited to this guarded CI-owned tag, not human version tags.
          git tag -f "$CONTINUOUS_RELEASE_TAG" "$GITHUB_SHA"
          git push "$auth_remote" "refs/tags/$CONTINUOUS_RELEASE_TAG:refs/tags/$CONTINUOUS_RELEASE_TAG" --force

          if [ "$GAPPD_SIGNED_RELEASE" = "1" ]; then
            release_kind="signed and notarized"
          else
            release_kind="unsigned development"
          fi
          notes="Continuous macOS arm64 $release_kind build from main at $GITHUB_SHA. Version $GAPPD_RELEASE_VERSION."
          if gh release view "$CONTINUOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$CONTINUOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$CONTINUOUS_RELEASE_NAME" --notes "$notes"
          else
            gh release create "$CONTINUOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$CONTINUOUS_RELEASE_NAME" --notes "$notes" --latest=false --target "$GITHUB_SHA"
          fi

          gh release view "$CONTINUOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r asset; do
            case "$asset" in
              *.dmg|latest.json) gh release delete-asset "$CONTINUOUS_RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done
          gh release upload "$CONTINUOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" desktop/release/continuous/Gappd-main-latest-arm64.dmg desktop/release/continuous/latest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gappd-desktop-macos
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/continuous/**
            desktop/release/mac*/**
